[project]
name = "snow-gradient-exploration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "matplotlib>=3.9", "typer>=0.15", "scipy>=1.14", "scikit-learn>=1.6"]

[dependency-groups]
dev = ["ruff>=0.11", "basedpyright>=1.28", "pytest>=8.3"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "standard"
