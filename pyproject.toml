[project]
name = "snow-divides"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "scikit-learn>=1.6", "matplotlib>=3.9", "plotly>=6.0", "reportlab>=5.0", "typer>=0.15"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.11", "basedpyright>=1.28", "pytest>=8.3"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "standard"
